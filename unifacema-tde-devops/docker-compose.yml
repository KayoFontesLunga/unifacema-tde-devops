version: '3.8'

services:
  web:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - todo-network

  api:
    build:
      context: . # O ponto (.) indica que o Docker deve olhar a pasta atual
      dockerfile: Dockerfile # O nome exato do arquivo (D maiúsculo)
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Database=tododb;Username=postgres;Password=postgres
    depends_on:
      db:
        condition: service_healthy
    networks:
      - todo-network

  db:
    image: postgres:latest
    environment:
      - POSTGRES_DB=tododb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PGDATA=/var/lib/postgresql/data/pgdata # <-- NOVO: Define o subdiretório correto
    volumes:
      - postgres_data:/var/lib/postgresql/data # <-- Montamos na pasta pai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tododb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - todo-network

networks:
  todo-network:
    driver: bridge

volumes:
  postgres_data: