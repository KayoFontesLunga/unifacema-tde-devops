name: CI

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: tododb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # 1. Restore: Usando curingas (**) para o GitHub achar o arquivo em qualquer subpasta
    - name: Restore dependencies
      run: dotnet restore **/unifacema-tde-devops.csproj

    # 2. Build
    - name: Build
      run: dotnet build **/unifacema-tde-devops.csproj --no-restore

    # 3. Test: Apontando para a pasta que vi na sua imagem
    - name: Test
      run: dotnet test TodoApi.Tests/TodoApi.Tests.csproj --no-build --verbosity normal

    # 4. Docker Build: O segredo está no -f para indicar onde está o Dockerfile
    - name: Build Docker Image
      run: |
        docker build -t todo-api:latest -f unifacema-tde-devops/Dockerfile .
