events {
    worker_connections 1024;
}

http {
    upstream todo_api {
        server api:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://todo_api;
        }

        location /swagger {
            proxy_pass http://todo_api/swagger;
        }

        location /swagger/ {
            proxy_pass http://todo_api/swagger/;
        }
    }
}